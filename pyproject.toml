[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lyra-ocr"
version = "0.1.0"
description = "Hardcoded-lyrics OCR pipeline for video to LRC"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "vincentlalo-long", email = "nickmoi3056@gmail.com" },
]
keywords = [
    "ocr",
    "lyrics",
    "lrc",
    "subtitles",
    "karaoke",
    "video-processing",
    "speech-recognition",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "faster-whisper>=1.0.0",
    "jaconv>=0.3.4",
    "numpy>=1.24.0",
    "onnxruntime>=1.17.0",
    "opencv-python>=4.8.0",
    "pillow>=10.0.0",
    "pykakasi>=2.3.0",
    "pyyaml>=6.0",
    "rapidocr>=3.0.0",
    "scipy>=1.10.0",
    "symspellpy>=6.7.7",
    "yt-dlp>=2024.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
]
eval = [
    "matplotlib>=3.8.0",
]

[project.urls]
Homepage = "https://github.com/vincentlalo-long/lyra-ocr"
Repository = "https://github.com/vincentlalo-long/lyra-ocr"
Issues = "https://github.com/vincentlalo-long/lyra-ocr/issues"

[project.scripts]
lyra-ocr = "lyra_ocr.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs ffmpeg/OCR/GPU",
    "gpu: needs CUDA",
]
addopts = "-m 'not slow and not gpu'"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
ignore = ["E501"]

[tool.setuptools.packages.find]
where = ["src"]
